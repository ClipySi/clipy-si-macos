included:
  - Clipy
  - ClipyTests
opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - overridden_super_call
  - redundant_nil_coalescing
  - private_outlet
  - operator_usage_whitespace
  - closure_end_indentation
  - first_where
  - fatal_error_message
  - vertical_parameter_alignment_on_call
  - let_var_whitespace
  - unneeded_parentheses_in_closure_argument
  - extension_access_modifier
  - pattern_matching_keywords
  - literal_expression_end_indentation
  - joined_default_parameter
  - contains_over_first_not_nil
  - override_in_extension
  - private_action
  - single_test_class
  - yoda_condition
disabled_rules:
  # NOTE: force_try is intentionally NOT disabled here (unlike the original repos/Clipy).
  # The rewrite must avoid `try!` — let SwiftLint flag it. See security-guidance.md.
  - todo
  - cyclomatic_complexity
identifier_name:
  excluded:
    - i
    - id
    - db   # GRDB migration/transaction closure convention (`{ db in … }`)
line_length: 300
type_body_length:
  - 300
  - 400
file_length:
  warning: 500
  error: 1000
function_body_length:
  warning: 100
  error: 200
type_name:
  excluded:
    - id
    - ID
